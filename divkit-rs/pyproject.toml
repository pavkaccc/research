[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "divkit-rs"
version = "0.1.0"
description = "Fast Rust-backed DivKit JSON builder with Python bindings"
requires-python = ">=3.8"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "divkit_rs._native"
python-source = "python"
